name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install -r requirements-build.txt
      - name: Build and test
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          $version = & .\.venv\Scripts\python -c 'from codex_switch import __version__; print(__version__)'
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and source version must match.' }
          .\scripts\build.ps1 -Version $version
      - name: Test installer and uninstaller
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*-setup.exe | Select-Object -First 1
          .\.venv\Scripts\python scripts/installer_smoke.py $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --title "Codex Switch ${GITHUB_REF_NAME}" --notes-file docs/release-notes.md
