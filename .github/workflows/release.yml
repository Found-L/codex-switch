name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install -r requirements-build.txt
      - name: Build and test
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          $version = & .\.venv\Scripts\python -c 'from codex_switch import __version__; print(__version__)'
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and source version must match.' }
          .\scripts\build.ps1 -Version $version
      - name: Test installer and uninstaller
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*-setup.exe | Select-Object -First 1
          .\.venv\Scripts\python scripts/installer_smoke.py $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            python_arch: arm64
          - runner: macos-15-intel
            arch: x86_64
            python_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: ${{ matrix.python_arch }}
      - name: Install build dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-build.txt
      - name: Build and test native macOS app and installer
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          export PYTHONPATH=src
          version=$(.venv/bin/python -c 'from codex_switch import __version__; print(__version__)')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Tag and source version must match.' >&2
            exit 1
          fi
          .venv/bin/python scripts/macos_ci.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: release
      - name: Consolidate checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          release = Path('release')
          assets = sorted(p for p in release.iterdir() if p.suffix in ('.exe', '.zip', '.dmg'))
          (release / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in assets))
          for path in release.glob('SHA256SUMS-macos-*.txt'):
              path.unlink()
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --title "Codex Switch ${GITHUB_REF_NAME}" --notes-file docs/release-notes.md
